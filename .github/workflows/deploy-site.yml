name: Deploy Publisher Site

# Builds the kanonak.org publisher origin from the package graph and
# deploys it to GitHub Pages.
#
# The entire site — human-facing pages AND the machine-facing publisher
# endpoints — is produced by a single `kanonak publish`. There is no
# bespoke YAML parsing here: the CLI reads the packages through the SDK
# object model (so names, versions, aliases, and imports resolve exactly
# as everywhere else) and writes a complete static origin:
#
#   - the landing page and every package/resource page, derived through
#     the look cascade (the root derives from kanonak-org/home — there is
#     no hand-written HTML);
#   - .well-known/kanonak.json (discovery + featured_packages), kanonak.lock
#     (the resolution + integrity source), and the raw
#     {package}/{version}.kan.yml sources that `kanonak install` / `connect`
#     and HTTP import resolution fetch.
#
# The build output is plain static files, portable to any host. The only
# GitHub-Pages-specific steps are CNAME and .nojekyll below; an S3 / CDN
# deploy would swap just those. This workflow is meant to read as a
# reference for anyone statically hosting a Kanonak publisher.
#
# It runs on a push here, by hand, and every 30 minutes, when it deploys only
# if packages' main has moved since the commit the live site was built from.
# That needs no token in packages to signal this repository (kanonak.org#1).

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - name: Decide whether packages' main has moved since the live site was built
        id: compare
        env:
          EVENT: ${{ github.event_name }}
          RECORD: https://kanonak.org/packages-commit.txt
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(git ls-remote https://github.com/kanonak-protocol/packages refs/heads/main | cut -f1 || true)
          if [ -z "$head" ]; then echo "::error::git ls-remote named no commit for kanonak-protocol/packages' main"; exit 1; fi
          status=$(curl -sS -o deployed.txt -w '%{http_code}' "$RECORD" || true)
          case "$status" in
            200) deployed=$(tr -d '[:space:]' < deployed.txt) ;;
            404) deployed="" ;;
            *) echo "::error::$RECORD answered $status, so the commit the live site was built from is unknown"; exit 1 ;;
          esac
          if [ "$deployed" = "$head" ]; then
            echo "The live site was built from packages' main, $head, so there is nothing to deploy."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            from="$deployed"
            if [ -z "$from" ]; then from="a commit it doesn't record"; fi
            echo "packages' main is $head and the live site was built from $from, so it deploys."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout site repo
        # Provides the GitHub-Pages host specifics (CNAME) that the
        # platform-agnostic build deliberately omits.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout packages source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kanonak-protocol/packages
          path: _packages

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install the Kanonak CLI
        # The CLI package-lock.json names, exactly: a new CLI reaches this site
        # only by a reviewed change to the lock.
        run: npm ci

      - name: Build the publisher origin
        # One command renders the whole origin from the package graph.
        run: npx --no-install kanonak publish --workspace _packages --out _site

      - name: Record the packages commit this origin was built from
        # The scheduled run compares packages' main with this to decide whether to deploy.
        run: git -C _packages rev-parse HEAD > _site/packages-commit.txt

      - name: Add GitHub Pages host specifics
        run: |
          # Custom domain.
          cp CNAME _site/CNAME
          # Serve the tree verbatim: no Jekyll processing, and dotfiles
          # like .well-known/ (plus any underscore paths) are preserved.
          touch _site/.nojekyll

      - name: Clean up packages checkout
        run: rm -rf _packages

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
