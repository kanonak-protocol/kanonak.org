name: Deploy Publisher Site

# Builds the kanonak.org publisher origin from the package graph and
# deploys it to GitHub Pages.
#
# The entire site — human-facing pages AND the machine-facing publisher
# endpoints — is produced by a single `kanonak publish`. There is no
# bespoke YAML parsing here: the CLI reads the packages through the SDK
# object model (so names, versions, aliases, and imports resolve exactly
# as everywhere else) and writes a complete static origin:
#
#   - the landing page and every package/resource page, derived through
#     the look cascade (the root derives from kanonak-org/home — there is
#     no hand-written HTML);
#   - .well-known/kanonak.json (discovery + featured_packages), kanonak.lock
#     (the resolution + integrity source), and the raw
#     {package}/{version}.kan.yml sources that `kanonak install` / `connect`
#     and HTTP import resolution fetch.
#
# The build output is plain static files, portable to any host. The only
# GitHub-Pages-specific steps are CNAME and .nojekyll below; an S3 / CDN
# deploy would swap just those. This workflow is meant to read as a
# reference for anyone statically hosting a Kanonak publisher.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The packages repo pings this (repository_dispatch) when it changes,
  # so the published origin tracks the package graph.
  repository_dispatch:
    types: [packages-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        # Provides the GitHub-Pages host specifics (CNAME) that the
        # platform-agnostic build deliberately omits.
        uses: actions/checkout@v4

      - name: Checkout packages source
        uses: actions/checkout@v4
        with:
          repository: kanonak-protocol/packages
          path: _packages

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Kanonak CLI
        # Requires a CLI version whose `publish` emits the machine-facing
        # endpoints (.well-known/kanonak.json, kanonak.lock, raw .kan.yml).
        run: npm install -g @kanonak-protocol/cli

      - name: Build the publisher origin
        # One command renders the whole origin from the package graph.
        run: kanonak publish --workspace _packages --out _site

      - name: Add GitHub Pages host specifics
        run: |
          # Custom domain.
          cp CNAME _site/CNAME
          # Serve the tree verbatim: no Jekyll processing, and dotfiles
          # like .well-known/ (plus any underscore paths) are preserved.
          touch _site/.nojekyll

      - name: Clean up packages checkout
        run: rm -rf _packages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
